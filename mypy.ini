[mypy]
python_version = 3.12
# The plugin dir is a package (it has __init__.py). Run `python tools/mypy_check.py`,
# which puts the parent dir on MYPYPATH so relative imports resolve.
# Do not run `mypy .` by hand.
explicit_package_bases = True
ignore_missing_imports = True
# Scope is all modules; annotations are added incrementally. Annotated code is checked.
# Every module has a try/except dual import (package mode / top-level load) and
# mypy treats the two as a redefinition. That is the existing style, so no-redef
# is off until the imports are unified.
disable_error_code = no-redef
allow_untyped_defs = True
allow_untyped_calls = True
warn_unused_ignores = True
# NOTE: keep this file ASCII-only -- mypy reads it with the locale codec.
exclude = (?x)(
    ^tests/
    | ^tools/
    | __pycache__/
    )